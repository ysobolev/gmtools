name: Feedback Terraform

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Trusted branch, tag, or commit SHA (blank uses the selected workflow ref)"
        required: false
        type: string
      operation:
        description: "Plan only, or create and apply a plan"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: feedback-terraform-production
  cancel-in-progress: false

jobs:
  terraform:
    name: Feedback infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: feedback-production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out requested ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Record resolved commit
        run: git rev-parse HEAD

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test Worker
        run: |
          pnpm feedback:build
          node --test tests/feedback-worker.test.mjs

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate configuration and run mocked tests
        working-directory: infra/feedback
        run: |
          terraform init -backend=false -lockfile=readonly
          terraform fmt -check
          terraform validate
          terraform test

      - name: Plan and optionally apply
        working-directory: infra/feedback
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPERATION: ${{ inputs.operation }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?}" "${AWS_SECRET_ACCESS_KEY:?}" "${CLOUDFLARE_API_TOKEN:?}" "${CLOUDFLARE_ACCOUNT_ID:?}"
          export AWS_ENDPOINT_URL_S3="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export TF_VAR_account_id="$CLOUDFLARE_ACCOUNT_ID"
          terraform init -lockfile=readonly
          terraform plan -lock-timeout=5m -out=feedback.tfplan
          if [ "$OPERATION" = "apply" ]; then
            terraform apply -lock-timeout=5m feedback.tfplan
            terraform output -raw worker_url
          fi
